name: Browser localization smoke
on:
  push:
    branches:
      - feature/trilingual-ui
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install chromium
      - run: node tests/browser-language-smoke.cjs
