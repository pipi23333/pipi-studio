name: Browser language accessibility
on:
  push:
    branches:
      - fix/language-preference-coverage
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install chromium
      - name: Check browser language and modal isolation
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');
          const http = require('node:http');
          const fs = require('node:fs');
          const path = require('node:path');
          (async () => {
            const server = http.createServer((req,res)=>{
              const name = new URL(req.url,'http://localhost').pathname;
              const file = path.join(process.cwd(),name==='/'?'index.html':name.slice(1));
              if(!fs.existsSync(file)){res.writeHead(404);res.end();return;}
              res.setHeader('Content-Type',file.endsWith('.js')?'application/javascript':file.endsWith('.html')?'text/html; charset=utf-8':'application/octet-stream');
              fs.createReadStream(file).pipe(res);
            });
            await new Promise(resolve=>server.listen(0,'127.0.0.1',resolve));
            let browser;
            try {
              browser=await chromium.launch({headless:true});
              const base='http://127.0.0.1:'+server.address().port;
              for(const [locale,expected,documentLang] of [['zh-CN','zh','zh-CN'],['en-US','en','en'],['es-ES','es','es'],['fr-FR','es','es']]){
                const ctx=await browser.newContext({locale,viewport:{width:390,height:844}});
                const page=await ctx.newPage();
                const errors=[];
                page.on('pageerror',e=>errors.push(e.message));
                await page.goto(base);
                assert(await page.locator('#languageGate').isVisible());
                assert.equal(await page.locator('html').getAttribute('lang'),documentLang);
                assert.equal(await page.locator('[data-recommended]').getAttribute('data-language'),expected);
                assert.equal(await page.evaluate(()=>document.activeElement.dataset.language),expected);
                assert(await page.locator('body > header, body > main, body > footer').evaluateAll(es=>es.every(e=>e.inert&&e.getAttribute('aria-hidden')==='true')));
                assert.equal(await page.evaluate(()=>localStorage.getItem('pipi-language')),null);
                await page.keyboard.press('Escape');
                assert(await page.locator('#languageGate').isVisible());
                await page.locator('[data-language="en"]').click();
                assert(!(await page.locator('#languageGate').isVisible()));
                assert(await page.locator('body > header, body > main, body > footer').evaluateAll(es=>es.every(e=>!e.inert&&!e.hasAttribute('aria-hidden'))));
                assert.equal(await page.evaluate(()=>localStorage.getItem('pipi-language')),'en');
                await page.selectOption('#res','128');
                await page.locator('#languageSwitch').click();
                assert(await page.locator('main').evaluate(e=>e.inert));
                await page.keyboard.press('Escape');
                assert(!(await page.locator('#languageGate').isVisible()));
                assert.equal(await page.locator('#res').inputValue(),'128');
                assert.equal(await page.evaluate(()=>document.activeElement.id),'languageSwitch');
                await page.goto(base+'/color-lab.html');
                assert.equal(await page.locator('html').getAttribute('lang'),'en');
                assert(!(await page.locator('#languageGate').isVisible()));
                await page.goto(base+'/?lang=zh');
                assert.equal(await page.locator('html').getAttribute('lang'),'zh-CN');
                assert(!(await page.locator('#languageGate').isVisible()));
                assert.deepEqual(errors,[]);
                await ctx.close();
              }
              console.log('Browser accessibility and locale checks passed for four locales');
            } finally {if(browser)await browser.close();server.close();}
          })().catch(e=>{console.error(e);process.exitCode=1;});
          JS
