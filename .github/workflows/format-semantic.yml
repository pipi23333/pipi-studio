name: Format semantic localization
on:
  push:
    branches:
      - refactor/semantic-i18n
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run format
      - run: npm run format
      - run: npm run format:check
      - run: npm test
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine tests index.html color-lab.html
          if ! git diff --cached --quiet; then
            git commit -m "Format stable translation keys"
            git push origin HEAD:refs/heads/refactor/semantic-i18n
          fi
