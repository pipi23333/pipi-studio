name: Browser semantic localization
on:
  push:
    branches:
      - refactor/semantic-i18n
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install chromium
      - name: Validate semantic keys in real browser
        run: |
          node <<'JS'
          const { chromium }=require('playwright');
          const assert=require('node:assert/strict');
          const http=require('node:http'), fs=require('node:fs'),path=require('node:path');
          (async()=>{
            const server=http.createServer((req,res)=>{
              const name=new URL(req.url,'http://localhost').pathname;
              const file=path.join(process.cwd(),name==='/'?'index.html':name.slice(1));
              if(!fs.existsSync(file)){res.writeHead(404);res.end();return;}
              res.setHeader('Content-Type',file.endsWith('.js')?'application/javascript':file.endsWith('.html')?'text/html; charset=utf-8':'application/octet-stream');
              fs.createReadStream(file).pipe(res);
            });
            await new Promise(resolve=>server.listen(0,'127.0.0.1',resolve));
            let browser;
            try {
              browser=await chromium.launch();
              const ctx=await browser.newContext({locale:'zh-CN',viewport:{width:390,height:844}});
              const page=await ctx.newPage(),errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              const base='http://127.0.0.1:'+server.address().port;
              await page.goto(base);
              assert(await page.locator('#languageGate').isVisible());
              assert.equal(await page.locator('[data-recommended]').getAttribute('data-language'),'zh');
              assert(await page.locator('main').evaluate(e=>e.inert&&e.getAttribute('aria-hidden')==='true'));
              await page.locator('[data-language="zh"]').click();
              assert.match(await page.locator('h1').innerText(),/回忆/);
              assert(!(await page.locator('main').evaluate(e=>e.inert)));
              await page.selectOption('#paletteMode','physical');
              await page.selectOption('#res','128');
              await page.selectOption('#size','60');
              assert(await page.locator('#exportPixel').isDisabled());
              assert.match(await page.locator('#pitch').innerText(),/直接耗材.*0\.47/);
              await page.locator('#physicalPalette').fill('bad');
              await page.locator('#applyPalette').click();
              assert.match(await page.locator('#paletteError').innerText(),/HEX/);
              await page.locator('#languageSwitch').click();
              await page.locator('[data-language="en"]').click();
              assert.equal(await page.locator('#physicalPalette').inputValue(),'bad');
              assert.match(await page.locator('#paletteError').innerText(),/Enter 2 to 9/);
              assert.match(await page.locator('#pitch').innerText(),/direct filament.*0\.47/);
              assert(await page.locator('#exportPixel').isDisabled());
              assert.match(await page.locator('#pixelCanvas').getAttribute('aria-label'),/preview/);
              await page.locator('a[href^="color-lab.html"]').click();
              assert.equal(await page.locator('html').getAttribute('lang'),'en');
              assert.match(await page.locator('#dbSummary').innerText(),/95 recipes/);
              await page.locator('#notes').fill('original note');
              await page.locator('#analyze').click();
              assert.match(await page.locator('#stats').innerText(),/Select an image/);
              await page.locator('#languageSwitch').click();
              await page.locator('[data-language="zh"]').click();
              assert.match(await page.locator('#stats').innerText(),/请选择图片/);
              assert.equal(await page.locator('#notes').inputValue(),'original note');
              assert.match(await page.locator('#dbSummary').innerText(),/95 种配方/);
              await page.locator('#languageSwitch').click();
              await page.locator('[data-language="es"]').click();
              assert.match(await page.locator('#stats').innerText(),/Selecciona una imagen/);
              assert(!((await page.locator('main').innerText()).includes('[missing:')));
              assert.deepEqual(errors,[]);
              console.log('Semantic localization: browser regression passed');
            }finally{if(browser)await browser.close();server.close();}
          })().catch(e=>{console.error(e);process.exitCode=1;});
          JS
